[project]
name = "trackboard"
version = "0.1.0"
description = "Pattern-first DSA practice and job pipeline for a small group"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "jinja2>=3.1",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "pydantic-settings>=2.6",
  "tenacity>=9.0",
  "python-multipart>=0.0.12",
  "rank-bm25>=0.2",
  "selectolax>=0.3",
  "pdfminer.six>=20240706",
  "fpdf2>=2.8",
]

[project.optional-dependencies]
full = [
  "google-api-python-client>=2.150",
  "google-auth-oauthlib>=1.2",
  "playwright>=1.48",
]

dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.7"]

[project.scripts]
trackboard = "trackboard.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trackboard"]

[tool.ruff]
line-length = 100
target-version = "py312"
